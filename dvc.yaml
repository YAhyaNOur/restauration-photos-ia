stages:
  degrade_train:
    cmd: python src/data/degrade.py --input data/raw/DIV2K_train_HR --output data/processed/train_LR --scale ${degrade.scale} --blur ${degrade.blur} --noise ${degrade.noise} --jpeg ${degrade.jpeg}
    deps:
      - data/raw/DIV2K_train_HR
      - src/data/degrade.py
    params:
      - degrade
    outs:
      - data/processed/train_LR

  degrade_valid:
    cmd: python src/data/degrade.py --input data/raw/DIV2K_valid_HR --output data/processed/valid_LR --scale ${degrade.scale} --blur ${degrade.blur} --noise ${degrade.noise} --jpeg ${degrade.jpeg}
    deps:
      - data/raw/DIV2K_valid_HR
      - src/data/degrade.py
    params:
      - degrade
    outs:
      - data/processed/valid_LR
  train:
    cmd: python src/models/train.py --config params.yaml
    deps:
      - src/models/train.py
      - src/models/srresnet.py
      - src/data/dataset.py
      - src/utils/metrics.py
      - data/raw/DIV2K_train_HR
      - data/raw/DIV2K_valid_HR
      - data/processed/train_LR
      - data/processed/valid_LR
      - splits
    params:
      - train
      - model
      - data
    outs:
      - checkpoints/srresnet_best.pt

  evaluate:
    cmd: python src/models/evaluate.py --config params.yaml --split test --bicubic --checkpoint checkpoints/srresnet_best.pt --metrics-out metrics/test_metrics.json
    deps:
      - src/models/evaluate.py
      - checkpoints/srresnet_best.pt
      - data/raw/DIV2K_train_HR
      - data/processed/train_LR
      - splits
    params:
      - data
      - model
    metrics:
      - metrics/test_metrics.json:
          cache: false